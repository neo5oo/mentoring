enable: true
id: audience
title: С какой ситуацией можно прийти
subtitle: Запрос не обязан быть идеально сформулирован. Достаточно понимать, что сейчас вызывает вопрос или мешает двигаться дальше.
items:
  - label: Старт
    icon: fa-solid fa-compass
    title: Только присматриваюсь к системному анализу
    text: >-
      Разберём ожидания от профессии, исходный опыт и построим план самостоятельного
      изучения — без дальнейшего ведения.
  - label: Развитие
    icon: fa-solid fa-chart-line
    title: Хочу понять свой следующий уровень
    text: >-
      Сверим текущие задачи и навыки, найдём сильные стороны и определим, что действительно
      стоит развивать дальше.
  - label: Практика
    icon: fa-solid fa-comments
    title: Хочу пройти МОК-собеседование
    text: >-
      Проведём интервью на выбранный уровень, разберём ответы и определим темы,
      которые стоит усилить.
  - label: Выбор
    icon: fa-solid fa-code-branch
    title: Нужно выбрать направление
    text: >-
      Сравним специализации, домены или варианты развития по понятным критериям,
      чтобы решение не строилось только на ощущениях.
