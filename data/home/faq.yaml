enable: true
id: faq
title: FAQ
items:
  - q: Можно прийти, если я ещё не работаю системным аналитиком?
    a: >-
      Да. Можно разобраться в профессии, сопоставить её со своим опытом и получить план самостоятельного изучения. Дальнейшее ведение в формат не входит.
  - q: С какими вопросами приходят действующие аналитики?
    a: >-
      Профессиональный рост, выбор специализации, подготовка к следующему уровню или МОК-собеседование с обратной связью по ответам.
  - q: Нужно заранее точно сформулировать запрос?
    a: >-
      Нет. Достаточно описать ситуацию своими словами. В начале встречи мы уточним цель и договоримся, какой результат хотим получить к концу разговора.
  - q: Что подготовить к консультации?
    a: >-
      Короткое описание опыта, текущего уровня и списка вопросов. Для МОК-собеседования достаточно указать желаемый уровень и темы, на которых хочется сфокусироваться.
  - q: Сколько длится встреча?
    a: >-
      Консультация или МОК-собеседование обычно занимает 75–90 минут. Точную длительность согласуем заранее.
  - q: Как записаться?
    a: >-
      Напиши [мне в Telegram](https://t.me/dimalkov61), коротко опиши ситуацию и желаемый результат. Я предложу подходящий формат и доступное время.
