enable: false
id: approach
title: Из тумана — в рабочую гипотезу
columns:
  - title: До консультации
    items:
      - «Кажется, мне не хватает вообще всего»
      - отклики уходят без понятной обратной связи
      - сложно сравнить варианты и выбрать ориентир
      - подготовка к интервью превращается в бесконечный список тем
  - title: На разборе
    items:
      - отделяем проблему навыков от проблемы упаковки
      - сверяем ожидания с требованиями выбранных ролей
      - расставляем приоритеты по влиянию на результат
      - превращаем советы в проверяемые шаги
  - title: После консультации
    items:
      - понятна цель и критерии подходящего решения
      - факты и аргументы собраны в одну картину
      - есть короткий план действий и метрики прогресса
      - ясно, когда менять тактику, а когда продолжать
