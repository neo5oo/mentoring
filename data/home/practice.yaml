enable: true
id: practice
title: Примеры конкретных запросов
lead: >-
  Не обязательно приходить с глобальной проблемой.
body: >-
  Хорошая консультация может быть посвящена одному решению, следующему карьерному шагу или подготовке к собеседованию.
cards:
  - title: «Не понимаю, с чего начать изучение»
    chips: [Старт, План]
    text: Определим базовый маршрут, порядок тем и признаки того, что можно двигаться дальше.
  - title: «Хочу сверить свой уровень»
    chips: [Навыки, Рост]
    text: Сопоставим текущие задачи с ожидаемой глубиной и найдём области с наибольшим эффектом для развития.
  - title: «Хочу пройти МОК-собеседование»
    chips: [Интервью, Обратная связь]
    text: Проведём интервью на выбранный уровень, а затем разберём сильные ответы и темы, которые стоит подтянуть.
  - title: «Не могу выбрать специализацию»
    chips: [Выбор, Траектория]
    text: Сравним направления через интерес, опыт, тип задач и долгосрочные цели.
