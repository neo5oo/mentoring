title: Практика вместо абстрактных советов
text:
  paragraphs:
    - >-
      Я — действующий senior системный аналитик. Работал в финтехе, страховании,
      атомной отрасли и документообороте; занимаюсь продуктовыми и интеграционными
      задачами в крупных корпоративных системах.
    - >-
      Прошел путь от госслужбы до senior-уровня и знаю, насколько по-разному может
      выглядеть развитие внутри одной профессии.
    - >-
      На встрече не выдаю универсальный рецепт. Вместе разбираем факты, проверяем
      предположения и собираем решение, которое подходит под конкретный контекст.

