enable: true
title: Сложную ситуацию можно **разложить по полочкам**
text: >-
  Помогаю разобраться в карьерном вопросе, оценить текущий уровень и собрать
  реалистичный следующий шаг — от плана входа в профессию до МОК-собеседования.
note: Для действующих аналитиков и тех, кто только выбирает направление
buttons:
  - label: Описать запрос
    link: https://t.me/dimalkov61
    primary: true
  - label: Посмотреть форматы
    link: /#formats
    primary: false
flow:
  title: Логика разбора
  steps:
    - title: Контекст
      text: фиксируем факты, ограничения и настоящий вопрос
    - title: Варианты
      text: рассматриваем несколько объяснений и сценариев
    - title: Критерии
      text: проверяем решения на риски и реалистичность
    - title: Следующий шаг
      text: выбираем действие, которое можно выполнить после встречи
items:
  - title: Разовая встреча
    text: Без обязательства продолжать работу после консультации
    icon: fa-solid fa-stopwatch
  - title: Один конкретный вопрос
    text: Фокусируемся на запросе, который важен прямо сейчас
    icon: fa-solid fa-crosshairs
  - title: Зафиксированный результат
    text: Ключевые выводы и следующие шаги остаются у тебя
    icon: fa-solid fa-note-sticky
