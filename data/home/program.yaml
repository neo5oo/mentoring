enable: true
id: process
title: Как проходит работа
subtitle: Не нужно заранее формулировать идеальный запрос. Достаточно описать ситуацию — структуру соберём вместе.
tracks:
  - title: Коротко описываешь ситуацию
    items:
      - цель или проблема своими словами
      - контекст, ограничения и желаемый результат
  - title: Я изучаю контекст до встречи
    items:
      - смотрю присланные материалы и логику ситуации
      - отмечаю вопросы и гипотезы для разбора
  - title: Разбираем задачу на созвоне
    items:
      - отделяем симптомы от настоящей причины
      - выбираем решение и проверяем его на реалистичность
  - title: Фиксируем следующий шаг
    items:
      - уходишь с приоритетами, а не с ещё одним списком из сотни тем
      - при необходимости можно отдельно договориться о следующем разборе
