<section id="{{ .id }}" class="scroll-mt-24 bg-accent py-16 sm:py-20 lg:py-24">
  <div class="container mx-auto grid max-w-6xl gap-10 px-4 lg:grid-cols-[1fr_auto] lg:items-end">
    <div>
      <p class="font-mono text-xs uppercase tracking-[0.15em] text-black/55">Следующий шаг</p>
      <h2 class="mt-5 max-w-4xl text-4xl font-bold leading-[1.02] tracking-[-0.045em] text-[#151515] sm:text-5xl lg:text-6xl">{{ .title }}</h2>
      <p class="mt-6 max-w-2xl text-lg leading-relaxed text-black/60">{{ .text }}</p>
    </div>
    {{ with .button }}<a class="inline-flex min-h-14 items-center justify-center gap-3 bg-[#171717] px-7 py-4 text-sm font-bold text-white transition-transform hover:-translate-y-1" href="{{ .url }}">{{ .label }} <span aria-hidden="true">↗</span></a>{{ end }}
  </div>
</section>
