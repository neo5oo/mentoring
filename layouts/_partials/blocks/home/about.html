<section id="{{ .id }}" class="scroll-mt-24 bg-primary py-20 text-white lg:py-28">
  <div class="container mx-auto max-w-6xl px-4">
    <div class="grid gap-14 lg:grid-cols-[0.8fr_1.2fr] lg:gap-24">
      <div>
        <p class="font-mono text-xs uppercase tracking-[0.14em] text-white/60">05 / опыт</p>
        <h2 class="mt-6 text-4xl font-bold leading-[1.05] tracking-[-0.04em] text-white sm:text-5xl">{{ .title }}</h2>
      </div>
      <div>
        <div class="space-y-5 text-lg leading-relaxed text-white/78">
          {{ range .text.paragraphs }}<p>{{ . }}</p>{{ end }}
        </div>
        {{ with .facts }}
          <div class="mt-12 grid border-t border-white/35 sm:grid-cols-2">
            {{ range $i, $fact := . }}
              <div class="border-b border-white/25 py-6 sm:odd:pr-6 sm:even:border-l sm:even:pl-6">
                <p class="font-mono text-xs text-accent">0{{ add $i 1 }}</p>
                <p class="mt-3 text-sm font-semibold leading-relaxed text-white">{{ $fact }}</p>
              </div>
            {{ end }}
          </div>
        {{ end }}
        <a class="mt-10 inline-flex items-center gap-2 border-b-2 border-accent pb-1 text-sm font-bold text-white transition-colors hover:text-accent" href="https://t.me/dimalkov61">Задать вопрос <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </div>
</section>
