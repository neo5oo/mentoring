<section id="{{ .id }}" class="scroll-mt-24 bg-white py-20 lg:py-28">
  <div class="container mx-auto grid max-w-6xl gap-12 px-4 lg:grid-cols-[0.7fr_1.3fr] lg:gap-20">
    <div>
      <p class="section-index">06 / вопросы</p>
      <h2 class="section-title mt-6">{{ .title }}</h2>
    </div>
    <div class="border-t border-black">
      {{ range .items }}
        <details class="details-smooth group border-b border-black/15">
          <summary class="flex cursor-pointer list-none items-start justify-between gap-6 py-6 marker:content-none [&::-webkit-details-marker]:hidden">
            <span class="text-lg font-bold leading-snug text-[#151515]">{{ .q }}</span>
            <span class="font-mono text-xl font-normal text-primary group-open:rotate-45" aria-hidden="true">+</span>
          </summary>
          <div class="details-content"><div class="details-content-inner max-w-2xl pb-7 pr-10 leading-relaxed text-black/55">{{ .a | markdownify }}</div></div>
        </details>
      {{ end }}
    </div>
  </div>
</section>
