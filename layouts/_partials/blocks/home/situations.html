<section id="{{ .id }}" class="scroll-mt-24 bg-[#f4f4f0] py-20 lg:py-28">
  <div class="container mx-auto grid max-w-6xl gap-12 px-4 lg:grid-cols-[0.75fr_1.25fr] lg:gap-20">
    <div class="lg:sticky lg:top-28 lg:self-start">
      <p class="section-index">04 / примеры</p>
      <h2 class="section-title mt-6">{{ .title }}</h2>
      <p class="mt-6 text-xl font-semibold leading-relaxed text-[#151515]">{{ .lead }}</p>
      <p class="mt-3 max-w-md leading-relaxed text-black/55">{{ .body }}</p>
    </div>
    <div class="border-t border-black">
      {{ range $i, $card := .cards }}
        <article class="grid gap-4 border-b border-black/15 py-7 sm:grid-cols-[2.5rem_1fr] sm:py-8">
          <p class="font-mono text-xs text-black/35">0{{ add $i 1 }}</p>
          <div>
            <h3 class="text-xl font-bold leading-snug text-[#151515] sm:text-2xl">{{ $card.title }}</h3>
            <p class="mt-3 max-w-xl leading-relaxed text-black/55">{{ $card.text }}</p>
            <div class="mt-4 flex flex-wrap gap-x-4 gap-y-1">
              {{ range $card.chips }}<span class="font-mono text-[0.65rem] uppercase tracking-[0.12em] text-primary">#{{ . }}</span>{{ end }}
            </div>
          </div>
        </article>
      {{ end }}
    </div>
  </div>
</section>
