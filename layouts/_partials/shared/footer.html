<footer class="bg-[#171717] pb-10 pt-14 text-white">
  <div class="container mx-auto max-w-6xl px-4">
    <div class="grid gap-10 border-b border-white/15 pb-12 sm:grid-cols-[1fr_auto] sm:items-end">
      <div><p class="text-xl font-bold">Разборы для системных аналитиков</p><p class="mt-3 max-w-lg text-sm leading-relaxed text-white/45">Разовые консультации по профессиональному росту, плану входа в профессию и подготовке к собеседованию.</p></div>
      {{ range site.Menus.footer }}{{ if eq .Name "Telegram" }}<a class="inline-flex items-center gap-2 border-b border-accent pb-1 text-sm font-bold text-white hover:text-accent" href="{{ .URL }}">Telegram <span aria-hidden="true">↗</span></a>{{ end }}{{ end }}
    </div>
    {{ with hugo.Data.shared.footer.copyright }}<p class="pt-8 font-mono text-[0.65rem] uppercase tracking-[0.12em] text-white/35">{{ . }}</p>{{ end }}
  </div>
</footer>
